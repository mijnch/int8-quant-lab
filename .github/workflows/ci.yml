name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read        # 저장소를 읽기만 한다 — GITHUB_TOKEN 을 쓰기 권한 없이 발급받는다

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}   # 같은 브랜치에 연달아 푸시하면 앞 실행을 취소한다
  cancel-in-progress: true

jobs:
  bitexact:
    # numpy 정수 커널이 LiteRT 세 실행 경로(참조·최적화·XNNPACK)와 비트 단위로 같은지,
    # 저장소에 넣어 둔 변환 결과를 명세 규칙으로 재현하는지 확인한다(TensorFlow·데이터 불필요).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20   # 실제 실행은 1~2분. 러너가 멈춰도 기본값(6시간)까지 돌지 않게 한다
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: python -m pip install -r requirements.txt

      - name: 실행 환경 기록(커널 선택은 CPU 명령어 집합에 따라 달라질 수 있다)
        run: python -c "import platform, numpy, importlib.metadata as m; print(platform.platform(), platform.machine(), platform.processor()); print('numpy', numpy.__version__, 'ai-edge-litert', m.version('ai-edge-litert'))"

      - name: 재양자화 규칙 탐침(연산·실행 경로마다 어느 규칙이 맞는지 표로 남긴다)
        run: python scripts/probe_rounding.py --models 40 --check

      - name: 테스트
        run: python -m pytest -q
